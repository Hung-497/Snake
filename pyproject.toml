[project]
name = "snake"
version = "0.1.0"
description = "A Python Snake game built with Arcade 3."
requires-python = ">=3.13"
dependencies = [
    "arcade~=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Install only for headless DQN training and evaluation.
dqn = [
    "numpy>=2.4,<3",
    "torch>=2.14,<3",
]

[tool.pytest.ini_options]
# Put the project root on sys.path so tests can `import snake`
# when run as `uv run pytest` (not only `python -m pytest`).
pythonpath = ["."]

[tool.uv]
# This is an app, not a package to install or publish.
package = false

# DQN runs on the CPU only (ADR 0007). On Linux, PyPI's torch also pulls
# several GB of CUDA packages, so Linux takes the CPU-only build instead.
# macOS and Windows already get CPU builds from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
