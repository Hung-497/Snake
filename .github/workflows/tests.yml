name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # Run every test, including the DQN tests, on all three systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs uv; the Python version comes from .python-version (3.13).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml.
      # The dqn group adds PyTorch (CPU-only) so the DQN tests run too.
      - run: uv sync --locked --group dqn
      - run: uv run pytest
